site_name: "Ateliers de professionnalisation – BTS SIO SISR 2e année"
site_description: "Ateliers de 2e année du BTS SIO option SISR : finaliser le portfolio, s'entraîner aux épreuves E5 et E6, ateliers transverses et techniques"
site_url: "https://yahnlp.github.io/bts2-sio-sisr-ateliers/"
site_author: "Yahn Le Prettre"
repo_url: "https://github.com/YahnLP/bts2-sio-sisr-ateliers"
edit_uri: "edit/main/docs/"

copyright: |
  © Yahn LE PRETTRE, Formateur ·
  <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">Licence CC BY-NC-SA 4.0</a>
  · Usage en formation payante ou financée : accord de l'auteur requis
  · Hébergé sur GitHub Pages

docs_dir: docs

theme:
  name: material
  language: fr
  font: false            # pas de police Google (RGPD)
  logo: images/logo-b2.png
  favicon: images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: "Passer au mode nuit"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: "Passer au mode jour"
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - navigation.footer
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      lang: fr
  - awesome-pages
  - callouts

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - pymdownx.snippets:
      base_path: ['.']
      auto_append:
        - includes/abbr.md
      check_paths: true
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - xtra/extra.css

extra_javascript:
  - xtra/extra.js
